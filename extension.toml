id = "docker-compose"
name = "Docker Compose"
version = "0.4.1"
schema_version = 1
authors = ["eth0net <eth0net@pm.me>"]
description = "Syntax highlighting and language server support for Docker Compose files, powered by the Docker Language Server"
repository = "https://github.com/eth0net/zed-docker-compose"

[language_servers.docker-language-server]
name = "Docker Language Server"
language = "Docker Compose"

# The server keys its Compose support off the LSP language id, so Zed has to
# send `dockercompose` rather than the language name.
[language_servers.docker-language-server.language_ids]
"Docker Compose" = "dockercompose"

[grammars.yaml]
repository = "https://github.com/zed-industries/tree-sitter-yaml"
commit = "baff0b51c64ef6a1fb1f8390f3ad6015b83ec13a"
